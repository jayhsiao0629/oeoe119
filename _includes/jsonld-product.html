{% if page.disable_default_product_jsonld != true %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "@id": "{{ page.url | absolute_url }}#product",
  "name": "{{ page.title | escape }}",
  "description": "{{ page.description | default: page.excerpt | strip_html | strip_newlines | escape }}",
  {% assign img_list = page.images | default: nil %}
  {% if img_list == nil and page.og_image %}{% assign img_list = page.og_image | split: '|' %}{% endif %}
  {% if img_list == nil and page.image %}{% assign img_list = page.image | split: '|' %}{% endif %}
  {% if img_list %}
  "image": [
    {% for i in img_list %}{% assign u = i | strip | absolute_url %}"{{ u }}"{% unless forloop.last %},{% endunless %}{% endfor %}
  ],
  {% endif %}
  {% if page.sku %}
  "sku": "{{ page.sku }}",
  {% endif %}
  "brand": { "@type": "Brand", "name": "{{ site.data.company.name }}" },
  {% if page.price %}
  "offers": {
    "@type": "Offer",
    "url": "{{ page.url | absolute_url }}",
    "priceCurrency": "{{ page.priceCurrency | default: 'TWD' }}",
    "price": "{{ page.price }}",
    "availability": "{{ page.availability | default: 'https://schema.org/InStock' }}"
  }
  {% endif %}
}
</script>
{% endif %}
