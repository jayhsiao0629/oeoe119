<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- SEO Tags -->
  {% seo %}
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="{{ site.title }}">
  {% if page.og_image or page.image %}
  <meta property="og:image" content="{{ (page.og_image | default: page.image) | absolute_url }}">
  {% endif %}
  {% if page.url %}
  <link rel="alternate" hreflang="zh-TW" href="{{ page.url | absolute_url }}">
  {% endif %}
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  {% if page.og_image or page.image %}
  <meta name="twitter:image" content="{{ (page.og_image | default: page.image) | absolute_url }}">
  {% endif %}
  
  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ site.data.company.name }}",
    "description": "{{ site.description }}",
    "url": "{{ site.url }}{{ site.baseurl }}",
    "telephone": "{{ site.data.company.contact.phone }}",
    "email": "{{ site.data.company.contact.email }}",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "TW",
      "addressLocality": "{{ site.data.company.contact.address | default: '新北市' }}"
    },
    "sameAs": [
      {% if site.facebook_url != "" %}"{{ site.facebook_url }}"{% endif %}{% if site.facebook_url != "" and site.youtube_url != "" %},{% endif %}
      {% if site.youtube_url != "" %}"{{ site.youtube_url }}"{% endif %}
    ]
  }
  </script>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon/favicon.jpeg' | relative_url }}">
  
  {% if page.lcp_image %}
  <!-- Preload LCP image to improve LCP -->
  <link rel="preload" as="image" href="{{ page.lcp_image | relative_url }}"{% if page.lcp_srcset %} imagesrcset="{{ page.lcp_srcset }}"{% endif %}{% if page.lcp_sizes %} imagesizes="{{ page.lcp_sizes }}"{% endif %} fetchpriority="high">
  {% endif %}
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  
  <!-- Note: Removed external Google Fonts and Font Awesome to avoid render-blocking
       and reduce unused CSS. Site uses system fonts defined in SCSS. -->
  
  <!-- Google Search Console 驗證（在 _config.yml 設定 google_site_verification） -->
  {% if site.google_site_verification %}
  <meta name="google-site-verification" content="{{ site.google_site_verification }}">
  {% endif %}

  <!-- Google Analytics 4（在 _config.yml 設定 google_analytics: G-XXXXXXXXXX） -->
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>
