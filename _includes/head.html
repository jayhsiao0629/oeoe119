<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- SEO Tags -->
  {% seo %}
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="{{ site.title }}">
  {% if page.og_image or page.image %}
  <meta property="og:image" content="{{ (page.og_image | default: page.image) | absolute_url }}">
  {% endif %}
  {% if page.url %}
  <link rel="alternate" hreflang="zh-TW" href="{{ page.url | absolute_url }}">
  {% endif %}
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  {% if page.og_image or page.image %}
  <meta name="twitter:image" content="{{ (page.og_image | default: page.image) | absolute_url }}">
  {% endif %}
  
  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ site.data.company.name }}",
    "description": "{{ site.description }}",
    "url": "{{ site.url }}{{ site.baseurl }}",
    "telephone": "{{ site.data.company.contact.phone }}",
    "email": "{{ site.data.company.contact.email }}",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "TW",
      "addressLocality": "{{ site.data.company.contact.address | default: '新北市' }}"
    },
    "sameAs": [
      {% if site.facebook_url != "" %}"{{ site.facebook_url }}"{% endif %}{% if site.facebook_url != "" and site.youtube_url != "" %},{% endif %}
      {% if site.youtube_url != "" %}"{{ site.youtube_url }}"{% endif %}
    ]
  }
  </script>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  {% if jekyll.environment == 'production' %}
  <!-- Google Analytics (請替換為您的 GA ID) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'GA_MEASUREMENT_ID');
  </script>
  {% endif %}
</head>
