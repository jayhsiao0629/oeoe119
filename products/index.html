---
title: 商品一覽
layout: default
---
<h1>商品一覽</h1>
<section class="grid">
  {% for item in site.data.products %}
    <article class="product-card">
      <a href="{{ '/products/' | append: item.slug | append: '.html' | relative_url }}">
        <img src="{{ item.image }}" alt="{{ item.title }}">
        <h2>{{ item.title }}</h2>
        <p>{{ item.description }}</p>
      </a>
    </article>
  {% endfor %}
</section>
