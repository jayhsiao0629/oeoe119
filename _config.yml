# Site settings
title: "消防宣導品批發｜亞之騰有限公司"
description: "亞之騰有限公司專營消防宣導品批發，多年政府機關、消防局、學校合作經驗，支援企業活動宣導與客製化設計，快速交貨，適合政府採購、教育推廣與企業贈品。"
baseurl: "" # 使用自訂網域根目錄，若部署於子路徑請調整
url: "https://oeoe119.com.tw" # 站點主要網域（對應 CNAME）

# Jekyll 路徑建議
# baseurl 必須以斜線開頭（/oeoe119），local 跑 http://localhost:4000/oeoe119/
# 所有資源路徑請用 {{ site.baseurl }} 變數
author: "亞之騰有限公司"

# SEO settings
lang: zh-TW
locale: zh_TW
timezone: Asia/Taipei

# Contact information
phone: "0965-659-193"
phone2: "02-8685-3499"
email: "chih629@yahoo.com.tw"
line_id: "chih629"
company_id: "84154083"

# Social media (if applicable)
facebook_url: ""
youtube_url: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  products:
    output: true
    permalink: /products/:name/

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/

# Default values
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"
  - scope:
      path: ""
    values:
      layout: "default"
