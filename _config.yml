# ─────────────────────────────────────────────
# Google 工具設定（只需在這裡填入，不用碰 HTML）
# ─────────────────────────────────────────────

# Google Analytics 4
# 前往 https://analytics.google.com/ 取得評估 ID（格式：G-XXXXXXXXXX）
google_analytics: ""  # 例：G-ABC123DEF4

# Google Search Console 驗證
# 前往 https://search.google.com/search-console/
# 選「HTML 標記」驗證方式，把 content="..." 裡面的值貼在這裡
google_site_verification: ""  # 例：abc123xyz789

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  products:
    output: true
    permalink: /products/:name/

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/

# Default values
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"
  - scope:
      path: ""
    values:
      layout: "default"
